# Render Blueprint for the SoSync API.
# To deploy: push this file to GitHub, then in Render click
# "New +" → "Blueprint" → select this repo. Render reads this file.
services:
  - type: web
    name: sosync-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
